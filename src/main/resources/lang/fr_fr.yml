    many: "<info><accent><count></accent> demandes de téléportation · <accent>/tpa list"
  none: "<error>Tu n'as aucune demande de téléportation en cours."
  none-from: "<error>Aucune demande de <accent><player></accent> en cours."
  requester-gone: "<error><accent><player></accent> n'est plus connecté."
  accepted-target: "<info>Demande de <accent><player></accent> acceptée."
  accepted: "<accent><player></accent> <success>a accepté</success> <info>: départ dans <accent><seconds> s</accent>, tu peux bouger."
  accepted-here: "<accent><player></accent> <success>a accepté</success> <info>: il arrive dans <accent><seconds> s</accent>."
  denied-target: "<info>Demande de <accent><player></accent> refusée."
  denied: "<accent><player></accent> <info>a refusé ta demande de téléportation."
  expired: "<info>Ta demande à <accent><player></accent> a expiré sans réponse."
  target-left: "<info><accent><player></accent> a quitté le réseau : ta demande est annulée."
  claimed: "<error>Pas de téléportation dans le terrain d'un clan dont vous n'êtes pas tous les deux membres."
  claimed-requester: "<error><accent><player></accent> est dans le terrain d'un clan : téléportation impossible."
  failed-self: "<error>Téléportation vers <accent><player></accent> annulée</error> <dark_gray>(<reason>)</dark_gray>."
  failed-other: "<error>La téléportation de <accent><player></accent> a échoué</error> <dark_gray>(<reason>)</dark_gray> <info>: sa demande t'attend encore, <accent>/tpaccept <player></accent>."
  failed-traveller: "<info>Ta demande à <accent><player></accent> t'attend encore : il peut l'accepter de nouveau."
  reason:
    combat: "combat"
    cooldown: "délai entre deux téléportations"
    cancelled: "attente interrompue"
    busy: "une autre téléportation en cours"
    unreachable: "joueur introuvable"
  nothing-sent: "<error>Tu n'as envoyé aucune demande."
  cancelled: "<info>Ta demande de téléportation est annulée."
  cancelled-target: "<accent><player></accent> <info>a annulé sa demande de téléportation."
  trap-alert: "<error>[Mod]</error> <accent><player></accent> <info>a envoyé des demandes de tpa à <accent><count></accent> joueurs différents en <minutes> min <dark_gray>(piège ?)"
  toggle:
    all: "<info>Demandes de téléportation : <success>tout le monde</success>. <dark_gray>(/tptoggle : amis et clan seulement)"
    friends: "<info>Demandes de téléportation : <accent>amis et clan seulement</accent>. <dark_gray>(/tptoggle : personne)"
    none: "<info>Demandes de téléportation : <error>personne</error>. <dark_gray>(/tptoggle : tout le monde)"
    here-off: "<info>Plus personne ne peut te faire venir <dark_gray>(/tpahere)</dark_gray>."
    here-on: "<info>On peut de nouveau te faire venir <dark_gray>(/tpahere)</dark_gray>."
  ignore:
    added: "<info>Tu ignores les demandes de <accent><player></accent>."
    removed: "<info>Tu n'ignores plus les demandes de <accent><player></accent>."
    list: "<info>Demandes ignorées : <accent><players>"
    empty: "<info>Tu n'ignores personne. <dark_gray>/tpaignore <joueur>"
  auto:
    added: "<info>Les demandes de <accent><player></accent> seront acceptées toutes seules."
    removed: "<info>Les demandes de <accent><player></accent> ne seront plus acceptées toutes seules."
    list: "<info>Acceptés tout seuls : <accent><players>"
    empty: "<info>Personne n'est accepté tout seul. <dark_gray>/tpaauto <joueur> · /tpaauto clan"
    clan-on: "<info>Les demandes des membres de ton clan seront acceptées toutes seules."
    clan-off: "<info>Les demandes de ton clan ne seront plus acceptées toutes seules."
  clan:
