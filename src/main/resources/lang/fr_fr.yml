  usage-here: '<error>Utilisation : <accent>/tpahere \<joueur>'
  self: "<error>Tu ne peux pas t'envoyer une demande à toi-même."
  world-blocked: "<error>Pas de téléportation entre joueurs ici."
  self-combat: "<error>Tu es en combat : attends encore <accent><time> s</accent>."
  self-cooldown: "<error>Tu pourras te téléporter dans <accent><time> s</accent>."
  no-money: "<error>Il te faut <accent><amount></accent> pour un tpa."
  disabled: "<error><accent><player></accent> n'accepte pas les demandes de téléportation."
  friends-only: "<error><accent><player></accent> n'accepte que les demandes de ses amis et de son clan."
  here-disabled: "<error><accent><player></accent> ne veut pas qu'on le fasse venir : envoie-lui plutôt un <accent>/tpa</accent>."
  target-combat: "<error><accent><player></accent> est en plein combat : réessaie dans quelques secondes."
  spam: "<error>Tu viens déjà d'écrire à <accent><player></accent> : attends <accent><time> s</accent>."
  sent: "<info>Demande envoyée à <accent><player></accent> pour aller vers lui <dark_gray>(<seconds> s)</dark_gray>."
  sent-here: "<info>Demande envoyée à <accent><player></accent> pour qu'il vienne vers toi <dark_gray>(<seconds> s)</dark_gray>."
  received: "<accent><player></accent> <info>veut venir <accent>vers toi</accent>. <dark_gray>(<seconds> s)"
  received-here: "<accent><player></accent> <info>te demande de venir <accent>vers lui</accent>. <dark_gray>(<seconds> s)"
  reminder: "<info>La demande de <accent><player></accent> expire dans <accent><seconds> s</accent>."
  auto-accepted: "<info>Demande de <accent><player></accent> acceptée toute seule <dark_gray>(ami ou clan)</dark_gray>."
  button:
    accept: "<success><bold>[Accepter]</bold></success>"
    accept-hover: "<info>Accepter la demande de <accent><player></accent><newline><dark_gray>Il est sur <server>"
    deny: "<error><bold>[Refuser]</bold></error>"
    deny-hover: "<info>Refuser la demande de <accent><player>"
    ignore: "<dark_gray>[Ignorer]"
    ignore-hover: "<info>Ne plus recevoir les demandes de <accent><player></accent> <dark_gray>(/tpaignore)"
    cancel: "<dark_gray>[Annuler]"
    cancel-hover: "<info>Annuler ta demande"
    retry: "<accent><bold>[Réessayer]</bold></accent>"
    retry-hover: "<info>Accepter de nouveau la demande"
  bar:
