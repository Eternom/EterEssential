name: EterEssential
version: '${version}'

main: fr.eternom.eterEssential.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: Commandes essentielles du réseau (tpa, back, infos, argent, staff).
depend: [EterLib, EterEconomy]
softdepend: [EterSync, EterMarket, EterReward, EterSuccess, EterClan]

commands:
  # Téléportation entre joueurs
  tpa:
    description: Demander à se téléporter vers un joueur, même sur un autre serveur.
    usage: /tpa <joueur>
    permission: eteressential.tpa
  tpahere:
    description: Demander à un joueur de venir vers toi.
    usage: /tpahere <joueur>
    permission: eteressential.tpahere
  tpaccept:
    description: Accepter une demande de téléportation.
    usage: /tpaccept [joueur]
    aliases: [tpyes]
    permission: eteressential.tpa
  tpdeny:
    description: Refuser une demande de téléportation.
    usage: /tpdeny [joueur]
    aliases: [tpno]
    permission: eteressential.tpa
  tpacancel:
    description: Annuler la demande que tu as envoyée.
    usage: /tpacancel
    permission: eteressential.tpa
  tptoggle:
    description: Refuser (ou accepter de nouveau) toutes les demandes de téléportation.
    usage: /tptoggle
    permission: eteressential.tpa
  back:
    description: Revenir à ta dernière position.
    usage: /back
    permission: eteressential.back

  # Menu central, avec ses sous-menus
  menu:
    description: Le menu central (tout le serveur, sans commandes).
    usage: /menu [sous-menu]
    aliases: [profil, profile]
    permission: eteressential.menu

  lobby:
    description: Retour au lobby (bouton du menu ; tapé, /lobby est traité par le proxy).
    usage: /lobby
    permission: eteressential.lobby

  # Établis, coffre de l'Ender et four portatifs (commandes d'usage, par grade ou pour une durée)
  craft:
    description: Ouvrir un établi.
    usage: /craft
    aliases: [workbench, wb]
    permission: eteressential.craft
  anvil:
    description: Ouvrir une enclume.
    usage: /anvil
    permission: eteressential.anvil
  smithing:
    description: Ouvrir une table de forge.
    usage: /smithing
    permission: eteressential.smithing
  grindstone:
    description: Ouvrir une meule.
    usage: /grindstone
    permission: eteressential.grindstone
  stonecutter:
    description: Ouvrir un tailleur de pierre.
    usage: /stonecutter
    permission: eteressential.stonecutter
  enderchest:
    description: Ouvrir ton coffre de l'Ender.
    usage: /enderchest
    aliases: [ec, echest]
    permission: eteressential.enderchest
  furnace:
    description: Ouvrir ton four portatif (il cuit même fermé).
    usage: /furnace
    permission: eteressential.furnace

  # Informations
  list:
    description: Joueurs en ligne, par serveur.
    usage: /list
    aliases: [online, who]
    permission: eteressential.list
  find:
    description: Sur quel serveur est un joueur.
    usage: /find <joueur>
    permission: eteressential.find
  seen:
    description: Dernière connexion d'un joueur.
    usage: /seen <joueur>
    permission: eteressential.seen

  # Économie (Vault -> EterEconomy)
  money:
    description: Ton solde (ou celui d'un joueur, staff).
    usage: /money [joueur]
    aliases: [balance, bal]
    permission: eteressential.money
  pay:
    description: Donner de l'argent à un joueur, même hors ligne ou sur un autre serveur.
    usage: /pay <joueur> <montant>
    permission: eteressential.pay
  eco:
    description: Gérer le solde d'un joueur (staff, aussi depuis la console).
    usage: /eco <give|take|set|reset> <joueur> [montant]
    aliases: [economy]
    permission: eteressential.eco

  # Staff
  gm:
    description: Changer de mode de jeu.
    usage: /gm <mode> [joueur]
    permission: eteressential.gamemode
  gmc:
    description: Mode créatif.
    usage: /gmc [joueur]
    permission: eteressential.gamemode
  gms:
    description: Mode survie.
    usage: /gms [joueur]
    permission: eteressential.gamemode
  gma:
    description: Mode aventure.
    usage: /gma [joueur]
    permission: eteressential.gamemode
  gmsp:
    description: Mode spectateur.
    usage: /gmsp [joueur]
    permission: eteressential.gamemode
  fly:
    description: Activer ou couper le vol.
    usage: /fly [joueur]
    permission: eteressential.fly
  heal:
    description: Soigner (vie, feu, effets).
    usage: /heal [joueur]
    permission: eteressential.heal
  feed:
    description: Rassasier.
    usage: /feed [joueur]
    permission: eteressential.feed
  speed:
    description: Vitesse de marche ou de vol (selon si tu voles), de 1 à 10.
    usage: /speed <1-10> [joueur]
    permission: eteressential.speed
  clear:
    description: Vider un inventaire.
    usage: /clear [joueur]
    permission: eteressential.clear
  tp:
    description: Aller vers un joueur (tout le réseau) ou à des coordonnées, sans attente.
    usage: /tp <joueur> | /tp <x> <y> <z>
    permission: eteressential.tp
  tphere:
    description: Faire venir un joueur (tout le réseau), sans attente.
    usage: /tphere <joueur>
    permission: eteressential.tphere
  invsee:
    description: Ouvrir l'inventaire d'un joueur de ce serveur.
    usage: /invsee <joueur>
    permission: eteressential.invsee
  endersee:
    description: Ouvrir le coffre de l'Ender d'un joueur de ce serveur.
    usage: /endersee <joueur>
    permission: eteressential.endersee

permissions:
  # Joueurs (accordées à tous)
  eteressential.tpa:
    default: true
  eteressential.tpahere:
    default: true
  eteressential.money:
    default: true
  eteressential.menu:
    default: true
  eteressential.lobby:
    default: true
  eteressential.pay:
    default: true

  # Informations sur les joueurs : à accorder par grade (personne par défaut)
  eteressential.list:
    default: op
  eteressential.find:
    default: op
  eteressential.seen:
    default: op

  # Retour arrière : à accorder par grade (personne par défaut)
  eteressential.back:
    description: /back après une téléportation.
    default: op
  eteressential.back.death:
    description: /back ramène aussi au lieu de la mort.
    default: op

  # Établis, coffre de l'Ender et four portatifs : à accorder par grade ou pour une durée (personne par défaut)
  eteressential.craft:
    default: op
  eteressential.anvil:
    default: op
  eteressential.smithing:
    default: op
  eteressential.grindstone:
    default: op
  eteressential.stonecutter:
    default: op
  eteressential.enderchest:
    default: op
  eteressential.furnace:
    description: Le four portatif. Son contenu reste si la permission est retirée, et revient avec elle.
    default: op

  # Staff
  eteressential.gamemode:
    default: op
  eteressential.fly:
    default: op
  eteressential.heal:
    default: op
  eteressential.feed:
    default: op
  eteressential.speed:
    default: op
  eteressential.clear:
    default: op
  eteressential.tp:
    default: op
  eteressential.tphere:
    default: op
  eteressential.invsee:
    default: op
  eteressential.endersee:
    default: op
  eteressential.eco:
    description: /eco give, take, set, reset.
    default: op

  # Sur un autre joueur
  eteressential.others.*:
    description: Utiliser les commandes du staff sur un autre joueur, voir le solde des autres.
    default: op
    children:
      eteressential.others.gamemode: true
      eteressential.others.fly: true
      eteressential.others.heal: true
      eteressential.others.feed: true
      eteressential.others.speed: true
      eteressential.others.clear: true
      eteressential.others.money: true

  # Dispenses
  eteressential.bypass.*:
    description: Toutes les dispenses d'EterEssential.
    default: op
    children:
      eteressential.bypass.tptoggle: true
      eteressential.bypass.deathloss: true
  eteressential.bypass.tptoggle:
    description: Envoyer une demande de tpa même à un joueur qui les refuse.
    default: op
  eteressential.bypass.deathloss:
    description: Ne perdre aucun argent en mourant.
    default: op

  eteressential.admin:
    description: Toutes les permissions d'EterEssential.
    default: op
    children:
      eteressential.back: true
      eteressential.back.death: true
      eteressential.craft: true
      eteressential.anvil: true
      eteressential.smithing: true
      eteressential.grindstone: true
      eteressential.stonecutter: true
      eteressential.enderchest: true
      eteressential.furnace: true
      eteressential.list: true
      eteressential.find: true
      eteressential.seen: true
      eteressential.gamemode: true
      eteressential.fly: true
      eteressential.heal: true
      eteressential.feed: true
      eteressential.speed: true
      eteressential.clear: true
      eteressential.tp: true
      eteressential.tphere: true
      eteressential.invsee: true
      eteressential.endersee: true
      eteressential.eco: true
      eteressential.others.*: true
      eteressential.bypass.*: true
