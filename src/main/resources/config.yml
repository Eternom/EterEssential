# ============================================================
#  EterEssential
# ============================================================
#
#  Les règles de téléportation communes (attente, délai, combat) se règlent
#  dans EterLib/config.yml > teleport : elles s'appliquent aussi à /tpa et /back.
#  /tpa, /tp, /tphere et les messages de /pay traversent les serveurs (Redis, réglé dans EterLib).
#  Les textes sont dans lang/. Toute modification nécessite un redémarrage du serveur.

tpa:
  # Durée de vie d'une demande, en secondes.
  expire-seconds: 60

# /pay : seulement après ce temps de jeu actif (heures, temps de /stats d'EterSuccess, AFK exclu). Empêche un second
# compte de récolter récompenses du jour, kits et votes pour tout envoyer au compte principal. 0 : pas de limite.
pay:
  min-playtime-hours: 5

# /vote : la page de vote du site (Azuriom, plugin Vote). Seule cette page compte les votes et donne les récompenses :
# ne pas mettre les liens des sites de vote eux-mêmes. Vide : /vote prévient que le vote n'est pas configuré.
vote:
  page: "https://craft.eternom.fr/vote"

# Tout premier passage d'un joueur sur le réseau : un titre, l'essentiel pour démarrer (lang/ > newcomer), et une
# annonce aux autres pour l'accueillir : network (tout le réseau), server (ce serveur) ou none.
newcomers:
  announce: network

# Se déconnecter pendant un combat contre un joueur (pas un monstre) : mort sur place, comme une vraie mort (objets et
# expérience au sol, perte d'argent, message public). Pas pour un joueur expulsé (redémarrage, staff).
# Durée du combat : celle d'EterLib (EterLib/config.yml > teleport.combat-tag). Dispense : eteressential.bypass.combatlog.
combat-log:
  enabled: true

death:
  # Mourir fait perdre ce pourcentage de son argent (arrondi à l'unité inférieure ; 0 = rien). L'argent disparaît.
  # Un pourcentage : les grosses fortunes le sentent aussi. La banque d'un clan n'est pas touchée.
  # Dispense : eteressential.bypass.deathloss.
  money-loss-percent: 5
  # Message public à chaque mort, à la place de celui de Minecraft (variantes : lang/ > death.public.<cause>) :
  # network (tout le réseau), server (ce serveur seulement) ou none (message de Minecraft, rien de plus).
  # Le mort reçoit toujours une pique et une astuce (death.tips.<cause>), sa position et un son propre à sa mort.
  announce: network
  # Sons du mort, à changer cause par cause : "son volume hauteur" (sons Minecraft : entity.generic.burn...).
  # Causes : lava, fire, fall, void, drown, suffocation, starvation, lightning, magic, wither, freeze, contact
  # (cactus, baies), falling (enclume), kill (/kill), explosion, creeper, player, warden, dragon, mob, generic.
  # Ex : lava: "block.lava.extinguish 1 0.8"
  sounds: {}

# Menu central (/menu, /profil) : une porte vers tout le reste, avec des sous-menus. Un bouton lance une commande
# (command, sans le /) pour le joueur, ou ouvre un sous-menu (menu). Il n'est montré que s'il sert ici : commande
# présente sur ce serveur et permise au joueur ; sous-menu avec au moins un bouton montré.
# slot : case du menu (5 lignes, 0 à 44 ; le cadre occupe les bords). Nom et description : lang/ > menu.button.<id>.
# /menu <sous-menu> ouvre directement un sous-menu : les autres plugins y reviennent avec leur back-command
# (ex : "menu progression"). Un back-command vide ramène au menu central (EterLib).
# {player} dans une commande : le joueur la choisit dans la liste des joueurs connectés ; {amount} (montant) et {text}
# (message) : demandés dans une fenêtre. Ex : "pay {player} {amount}". Annuler ramène au menu.
# hide-on-lobby: true : bouton caché sur un lobby (EterHub). Ex : Spawn sur un lobby, Lobby ailleurs, à la même case.
# Si un bouton d'une ligne est caché, les autres boutons de la ligne se recentrent.
menu:
  # Accroupi + touche « changer de main » (Maj + F) : ouvre /menu
  shortcut: true
  # Page principale, rien que ce que tout le monde a (permissions par défaut) : les 5 catégories (2e ligne), puis 5
  # raccourcis vers ce qui sert le plus souvent (4e ligne). Au centre, les kits et Outils, qui n'apparaît qu'aux joueurs qui ont au
  # moins un outil (grade, pass). Le reste est dans les sous-menus : la page reste facile à lire.
  main:
    progression: { slot: 11, icon: EXPERIENCE_BOTTLE, menu: progression }
    voyager: { slot: 12, icon: COMPASS, menu: voyager }
    social: { slot: 13, icon: BELL, menu: social }
    clan: { slot: 14, icon: WHITE_BANNER, command: "clan" }
    economie: { slot: 15, icon: GOLD_INGOT, menu: economie }
    kits: { slot: 21, icon: BARREL, command: "kit" }
    outils: { slot: 23, icon: ANVIL, menu: outils }
    homes: { slot: 29, icon: RED_BED, command: "homes" }
    spawn: { slot: 30, icon: BEACON, command: "spawn" }
    lobby: { slot: 30, icon: OAK_DOOR, command: "lobby", hide-on-lobby: true }
    rtp: { slot: 31, icon: ENDER_PEARL, command: "rtp" }
    daily: { slot: 32, icon: CHEST, command: "daily" }
    pass: { slot: 33, icon: NETHER_STAR, command: "pass" }
  submenus:
    progression:
      succes: { slot: 20, icon: GOLDEN_APPLE, command: "succes" }
      defis: { slot: 21, icon: TARGET, command: "defis" }
      classement: { slot: 22, icon: GOLDEN_HELMET, command: "classement" }
      pass: { slot: 23, icon: NETHER_STAR, command: "pass" }
      daily: { slot: 24, icon: CHEST, command: "daily" }
    voyager:
      homes: { slot: 20, icon: RED_BED, command: "homes" }
      ressource: { slot: 21, icon: GRASS_BLOCK, command: "ressource" }
      rtp: { slot: 22, icon: ENDER_PEARL, command: "rtp" }
      tpa: { slot: 23, icon: LEAD, command: "tpa {player}" }
      tpahere: { slot: 24, icon: FISHING_ROD, command: "tpahere {player}" }
    social:
      chat: { slot: 20, icon: OAK_SIGN, command: "chat" }
      ignore: { slot: 21, icon: BARRIER, command: "ignore" }
      notifications: { slot: 22, icon: BELL, command: "notifications" }
      msgtoggle: { slot: 23, icon: PAPER, command: "msgtoggle" }
      report: { slot: 24, icon: REDSTONE_TORCH, command: "report" }
      msg: { slot: 30, icon: WRITABLE_BOOK, command: "msg {player} {text}" }
      visibility: { slot: 31, icon: ENDER_EYE, command: "visibility" }
      appel: { slot: 32, icon: BOOK, command: "appel" }
    economie:
      money: { slot: 20, icon: GOLD_NUGGET, command: "money" }
      pay: { slot: 22, icon: EMERALD, command: "pay {player} {amount}" }
      richesse: { slot: 24, icon: GOLD_BLOCK, command: "classement" }
    outils:
      craft: { slot: 20, icon: CRAFTING_TABLE, command: "craft" }
      anvil: { slot: 21, icon: ANVIL, command: "anvil" }
      smithing: { slot: 22, icon: SMITHING_TABLE, command: "smithing" }
      grindstone: { slot: 23, icon: GRINDSTONE, command: "grindstone" }
      stonecutter: { slot: 24, icon: STONECUTTER, command: "stonecutter" }
      enderchest: { slot: 30, icon: ENDER_CHEST, command: "enderchest" }
      four: { slot: 32, icon: FURNACE, command: "furnace" }

